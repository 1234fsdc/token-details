<h1>ZCode Token 速度 · 图标 — 闪电 × S 一体字形</h1>
<p class="lede">S 的骨架直接用闪电折线书写：上笔画的折点=闪电第一折，中段长斜线=闪电主笔画，下笔画折点=第二折。纸卡 #fffdf8 + 发丝边 #e9e5da + 朱红 #ff4d2e，与前端「纸面印刷」同语言。</p>
